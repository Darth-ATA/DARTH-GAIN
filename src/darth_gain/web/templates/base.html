<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DARTH-GAIN{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"
            integrity="sha384-HGfztofotPfshhWFM0RLAi0BBHMN41R0E1gQNINH6JhCZPwP3J3hRs0S0s1KUjI"
            crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body x-data>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">DARTH-GAIN</a>
            
            <!-- Desktop navigation links (visible >640px) -->
            <div class="nav-links">
                {% if request.cookies.get('dg_session') %}
                <a href="/routines" class="nav-link">Routines</a>
                <a href="/logout" class="nav-link">Logout</a>
                {% endif %}
            </div>
            
            <!-- Mobile hamburger menu (visible ≤640px) -->
            <details class="nav-toggle" id="nav-toggle">
                <summary class="nav-toggle-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">
                    <span></span><span></span><span></span>
                </summary>
                <div class="nav-menu" id="nav-menu" role="navigation">
                    {% if request.cookies.get('dg_session') %}
                    <a href="/routines" class="nav-link">Routines</a>
                    <a href="/logout" class="nav-link">Logout</a>
                    {% endif %}
                </div>
            </details>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Toast notifications -->
    <div x-data x-init="Alpine.store('toast') ? null : Alpine.store('toast', { toasts: [], show(msg, type='info') { const id = Date.now(); this.toasts.push({id, message: msg, type}); setTimeout(() => this.dismiss(id), 5000); }, dismiss(id) { this.toasts = this.toasts.filter(t => t.id !== id); } })"></div>
    <div x-data x-show="$store.toast && $store.toast.toasts.length" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform translate-y-2" x-transition:leave="transition ease-in duration-200" x-transition:leave-end="opacity-0" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
        <template x-for="toast in $store.toast.toasts" :key="toast.id">
            <div x-show="$store.toast.toasts.includes(toast)" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 transform translate-x-full" x-transition:leave="transition ease-in duration-150" x-transition:leave-end="opacity-0 transform translate-x-full" class="pointer-events-auto min-w-[280px] max-w-md px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center gap-3" :class="toast.type === 'success' ? 'bg-green-900/90 text-green-100 border border-green-700' : toast.type === 'error' ? 'bg-red-900/90 text-red-100 border border-red-700' : 'bg-blue-900/90 text-blue-100 border border-blue-700'">
                <span x-text="toast.message" class="flex-1"></span>
                <button @click="$store.toast.dismiss(toast.id)" class="flex-shrink-0 text-current opacity-70 hover:opacity-100" aria-label="Dismiss">✕</button>
            </div>
        </template>
    </div>
    
    <script type="module" src="/static/js/nav.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
